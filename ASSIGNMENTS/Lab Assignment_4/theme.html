<!DOCTYPE html>
<html>
<head><title>Color Theme Changer</title></head>
<body>
    <h2>Change Color Theme</h2>
    <button onclick="changeTheme('lightblue')">Blue Theme</button>
    <button onclick="changeTheme('lightgreen')">Green Theme</button>
    <button onclick="changeTheme('lightpink')">Pink Theme</button>
    <button onclick="changeTheme('white')">Default Theme</button>

    <script>
        function changeTheme(color) {
            document.body.style.backgroundColor = color;
        }
    </script>
</body>
</html>
